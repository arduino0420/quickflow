<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>500 | 処理中に問題が発生しました | QuickFlow</title>
  <style>
    @font-face { font-family: "Comic Neue"; font-style: normal; font-weight: 700; font-display: swap; src: url("/fonts/comic-neue/ComicNeue-Bold.ttf") format("truetype"); }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; padding: 2rem 1rem; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; overflow-wrap: anywhere; }
    main { max-width: 36rem; margin: 0 auto; text-align: center; }
    .app-brand { font-family: "Comic Neue", system-ui, sans-serif; margin: 0 0 2rem; color: #2563eb; font-size: clamp(2.5rem, 8vw, 3.5rem); font-weight: 700; letter-spacing: -0.04em; }
    .error-card { padding: clamp(1rem, 4vw, 2rem); background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; }
    .error-code { margin: 0; color: #64748b; font-size: 1.25rem; font-weight: 700; }
    h1 { margin: 0.5rem 0 1rem; font-size: 1.4rem; line-height: 1.5; }
    p { margin: 1rem 0; }
    a { display: inline-block; margin-top: 0.5rem; padding: 0.6rem 1rem; border-radius: 0.5rem; background: #2563eb; color: #fff; font-weight: 600; text-underline-offset: 0.2em; }
    a:hover { background: #1d4ed8; }
    a:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="app-brand">QuickFlow</p>
    <section class="error-card" aria-labelledby="error-heading">
      <p class="error-code">500</p>
      <h1 id="error-heading">処理中に問題が発生しました</h1>
      <p>しばらく時間をおいてから、トップページからお進みください。</p>
      <a href="/">トップページへ</a>
    </section>
  </main>
</body>
</html>

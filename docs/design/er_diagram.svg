<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1840" viewBox="0 0 1660 1840" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="1660" height="1840" fill="#f5f7fb" stroke="#f5f7fb" stroke-width="2"/><text x="40" y="25" dominant-baseline="text-before-edge" font-size="30" fill="#172b46">QuickFlow ER / 関係と制約</text><text x="40" y="74" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">実装基準 9704b30fa908  •  全カラム・型・デフォルト値は schema_reference.md / constraints.json</text><text x="40" y="117" dominant-baseline="text-before-edge" font-size="20" fill="#172b46">→ は子の列から親の id への DB FK。必須 = NOT NULL、? = NULL 可。親 1 : 子 0..N（別記を除く）。</text><text x="40" y="151" dominant-baseline="text-before-edge" font-size="20" fill="#172b46">U(...) は DB 複合 Unique。全表の主キーは id、認証制限のみ key_digest。日時列は詳細参照。</text><rect x="40" y="205" width="510" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="205" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="213" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">schools / 学校</text><text x="52" y="258" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">school_code 必須 / U(school_code)</text><rect x="580" y="205" width="510" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="205" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="213" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">teachers / 教師</text><text x="592" y="258" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">school_id 必須 → schools</text><text x="592" y="287" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">user_id 必須 / U(user_id)</text><text x="592" y="316" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">password_digest 必須</text><rect x="1120" y="205" width="510" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="205" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="213" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">admins / 管理者</text><text x="1132" y="258" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">school_id 必須 → schools</text><text x="1132" y="287" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">user_id 必須 / U(user_id)</text><text x="1132" y="316" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">password_digest 必須</text><rect x="40" y="435" width="510" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="435" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="443" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">classrooms / クラス</text><text x="52" y="488" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">school_id 必須 → schools</text><text x="52" y="517" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">teacher_id ? → teachers（旧列）</text><text x="52" y="546" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(school_id, grade, class_number)</text><rect x="580" y="435" width="510" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="435" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="443" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">teacher_classrooms / 担当クラス</text><text x="592" y="488" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">teacher_id 必須 → teachers</text><text x="592" y="517" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">classroom_id 必須 → classrooms</text><text x="592" y="546" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(teacher_id, classroom_id)</text><rect x="1120" y="435" width="510" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="435" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="443" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">students / 生徒</text><text x="1132" y="488" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">classroom_id 必須 → classrooms</text><text x="1132" y="517" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">attendance_number 必須</text><text x="1132" y="546" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(classroom_id, attendance_number)</text><rect x="40" y="665" width="510" height="173" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="665" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="673" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">assignments / 小テスト・配信</text><text x="52" y="718" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">teacher_id 必須 → teachers</text><text x="52" y="747" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">published_at ?</text><text x="52" y="776" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">current pointer ? → 生成要求</text><text x="52" y="805" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">title / point_per_question 必須</text><rect x="580" y="665" width="510" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="665" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="673" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">assignment_classrooms / 配信先</text><text x="592" y="718" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">assignment_id 必須 → assignments</text><text x="592" y="747" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">classroom_id 必須 → classrooms</text><text x="592" y="776" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(assignment_id, classroom_id)</text><rect x="1120" y="665" width="510" height="173" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="665" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="673" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">answer_drafts / 答案下書き</text><text x="1132" y="718" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">student_id 必須 → students</text><text x="1132" y="747" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">assignment_id 必須 → assignments</text><text x="1132" y="776" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(student_id, assignment_id)</text><text x="1132" y="805" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">fingerprint / page_data / lock_version</text><rect x="40" y="895" width="510" height="173" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="895" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="903" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">questions / 設問・正答</text><text x="52" y="948" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">assignment_id 必須 → assignments</text><text x="52" y="977" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(assignment_id, position)</text><text x="52" y="1006" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">question_text / correct_answer 必須</text><text x="52" y="1035" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">生成モデル・版・日時 必須</text><rect x="580" y="895" width="510" height="289" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="895" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="903" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">submissions / 提出答案</text><text x="592" y="948" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">assignment_id 必須 → assignments</text><text x="592" y="977" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">student_id 必須 → students</text><text x="592" y="1006" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(assignment_id, student_id)</text><text x="592" y="1035" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">status / submitted_at 必須</text><text x="592" y="1064" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">extracted_text ? / generation 必須</text><text x="592" y="1093" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">processing_claim_stage ?</text><text x="592" y="1122" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">processing_claim_token ?</text><text x="592" y="1151" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">processing_claimed_at ?</text><rect x="1120" y="895" width="510" height="202" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="895" width="510" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="903" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">grading_results / 採点結果</text><text x="1132" y="948" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">submission_id 必須 → submissions</text><text x="1132" y="977" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">question_id 必須 → questions</text><text x="1132" y="1006" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">U(submission_id, question_id)</text><text x="1132" y="1035" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">AI判定 必須 / 教師判定 ?</text><text x="1132" y="1064" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">読取確度・答案・所見など NULL 可</text><text x="40" y="1237" dominant-baseline="text-before-edge" font-size="24" fill="#172b46">内部処理・認証・ファイル（業務データと分離）</text><rect x="40" y="1290" width="650" height="260" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="1290" width="650" height="44" fill="#e8e0fa" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="1298" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">question_generation_requests / 正答生成要求</text><text x="52" y="1343" dominant-baseline="text-before-edge" font-size="17" fill="#172b46">assignment_id 必須 → assignments</text><text x="52" y="1372" dominant-baseline="text-before-edge" font-size="17" fill="#172b46">material_blob_id 必須：DB FK なし</text><text x="52" y="1401" dominant-baseline="text-before-edge" font-size="17" fill="#172b46">U(assignment_id, material_blob_id, model, prompt_version)</text><text x="52" y="1430" dominant-baseline="text-before-edge" font-size="17" fill="#172b46">model / prompt_version / state 必須</text><text x="52" y="1459" dominant-baseline="text-before-edge" font-size="17" fill="#172b46">claim_token / started_at / finished_at / failure_code ?</text><text x="52" y="1488" dominant-baseline="text-before-edge" font-size="17" fill="#172b46">assignments.current_question_generation_request_id は NULL 可</text><text x="52" y="1517" dominant-baseline="text-before-edge" font-size="17" fill="#172b46">同じ assignment の要求かはモデル検証（複合 FK なし）</text><rect x="720" y="1290" width="900" height="202" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="720" y="1290" width="900" height="44" fill="#e8e0fa" stroke="#b8c7d9" stroke-width="2"/><text x="732" y="1298" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">ActiveStorage / フレームワーク</text><text x="732" y="1343" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">attachments.blob_id 必須 → blobs / variant_records.blob_id 必須 → blobs</text><text x="732" y="1372" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">attachments: U(record_type, record_id, name, blob_id)</text><text x="732" y="1401" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">blobs: U(key) / variant_records: U(blob_id, variation_digest)</text><text x="732" y="1430" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">record_type + record_id は多態参照：業務表への DB FK なし</text><text x="732" y="1459" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">Assignment.material_file / Submission.answer_file はモデル関連</text><rect x="720" y="1540" width="900" height="115" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="720" y="1540" width="900" height="44" fill="#e8e0fa" stroke="#b8c7d9" stroke-width="2"/><text x="732" y="1548" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">authentication_attempt_buckets / 認証状態</text><text x="732" y="1593" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">PK key_digest (string 64) / attempts・expires_at 必須</text><text x="732" y="1622" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">学校・利用者への FK なし。HMAC キー、認証制限・ゲスト期限に使用</text><text x="40" y="1730" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">モデル検証：学校一致・配信先所属・採点対象の課題一致は追加の DB FK を意味しない。</text><text x="40" y="1770" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">担当クラスは teacher_classrooms。classrooms.teacher_id の nullable FK は現行 schema に残存。</text></svg>
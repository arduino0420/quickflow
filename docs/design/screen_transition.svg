<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1800" viewBox="0 0 1660 1800" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="1660" height="1800" fill="#f5f7fb" stroke="#f5f7fb" stroke-width="2"/><text x="40" y="25" dominant-baseline="text-before-edge" font-size="30" fill="#172b46">QuickFlow 画面遷移 / 実装された操作</text><text x="40" y="74" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">実装基準 9bed9d2b6e35  •  矢印は操作または応答。箱内に実ルート／状態を併記。詳細・認可は README.md。</text><rect x="40" y="115" width="1580" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="115" width="1580" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="123" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">公開トップ GET /</text><text x="52" y="168" dominant-baseline="text-before-edge" font-size="20" fill="#172b46">教師 /login・生徒 /student/login・管理者 /admin/login は別の認証入口。公開 signup / rails_admin はない。</text><text x="40" y="245" dominant-baseline="text-before-edge" font-size="26" fill="#172b46">教師</text><rect x="40" y="295" width="500" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="295" width="500" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="303" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">ログイン GET/POST /login</text><text x="52" y="348" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">ユーザーID + パスワード</text><path d="M290,384 L290,416" stroke="#456583" stroke-width="3" fill="none"/><polygon points="290,416 284.78041359066526,405.1946347717679 295.21958640933474,405.1946347717679" fill="#456583"/><rect x="40" y="424" width="500" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="424" width="500" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="432" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">配信一覧 GET /assignments</text><text x="52" y="477" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">自分が作成した配信を表示</text><rect x="40" y="553" width="500" height="115" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="553" width="500" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="561" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">一覧 → 配信登録 GET …/new</text><text x="52" y="606" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">学校内の配信先クラス・教材PDF・点数</text><text x="52" y="635" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">POST /assignments → 登録画面に戻る</text><rect x="40" y="711" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="711" width="500" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="719" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">一覧 → 詳細 GET /assignments/:id</text><text x="52" y="764" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">クラス切替・未提出/要確認・成績</text><text x="52" y="793" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">GET edit → PATCH タイトル変更</text><text x="52" y="822" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">DELETE → 一覧（作成者の範囲）</text><rect x="40" y="898" width="500" height="115" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="898" width="500" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="906" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">詳細 ↔ 答案 GET …/submissions/:id</text><text x="52" y="951" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">答案表示 GET …/answer</text><text x="52" y="980" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">PATCH 判定保存 → 同じ採点画面</text><rect x="40" y="1056" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="1056" width="500" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="1064" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">答案画面の条件操作「採点を再開する」</text><text x="52" y="1109" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">POST …/submissions/:id/resume_grading</text><text x="52" y="1138" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">フラグON + failed / 停止grading候補</text><text x="52" y="1167" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">安全条件不成立は拒否・運用者へ確認</text><text x="580" y="245" dominant-baseline="text-before-edge" font-size="26" fill="#172b46">生徒</text><rect x="580" y="295" width="500" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="295" width="500" height="44" fill="#d9f1e9" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="303" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">ログイン GET/POST /student/login</text><text x="592" y="348" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">学校コード・学年・組・出席番号・PW</text><path d="M830,384 L830,416" stroke="#456583" stroke-width="3" fill="none"/><polygon points="830,416 824.7804135906653,405.1946347717679 835.2195864093347,405.1946347717679" fill="#456583"/><rect x="580" y="424" width="500" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="424" width="500" height="44" fill="#d9f1e9" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="432" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">一覧 GET /student/assignments</text><text x="592" y="477" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">同じ学校・所属クラスへの配信のみ</text><path d="M830,513 L830,545" stroke="#456583" stroke-width="3" fill="none"/><polygon points="830,545 824.7804135906653,534.1946347717678 835.2195864093347,534.1946347717678" fill="#456583"/><rect x="580" y="553" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="553" width="500" height="44" fill="#d9f1e9" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="561" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">直接手書き GET …/:id/pdf_preview</text><text x="592" y="606" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">未提出カード → PDFに解答</text><text x="592" y="635" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">GET/PATCH …/:id/answer_draft 自動保存</text><text x="592" y="664" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">保存再試行 / 別タブ再ログイン→再開確認</text><path d="M830,700 L830,732" stroke="#456583" stroke-width="3" fill="none"/><polygon points="830,732 824.7804135906653,721.1946347717678 835.2195864093347,721.1946347717678" fill="#456583"/><rect x="580" y="740" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="740" width="500" height="44" fill="#d9f1e9" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="748" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">提出 POST …/:id/submission</text><text x="592" y="793" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">下書き版・教材・提出済みを照合</text><text x="592" y="822" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">応答不明時 GET submission / recovery</text><text x="592" y="851" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">同じ答案を確認して結果画面へ</text><path d="M830,887 L830,919" stroke="#456583" stroke-width="3" fill="none"/><polygon points="830,919 824.7804135906653,908.1946347717678 835.2195864093347,908.1946347717678" fill="#456583"/><rect x="580" y="927" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="927" width="500" height="44" fill="#d9f1e9" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="935" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">詳細・結果 GET …/:id</text><text x="592" y="980" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">submitted / grading は状態を再取得</text><text x="592" y="1009" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">completed：答案PDF・点数・問題別結果</text><text x="592" y="1038" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">failed：先生へ確認（生徒の再採点なし）</text><rect x="580" y="1114" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="580" y="1114" width="500" height="44" fill="#d9f1e9" stroke="#b8c7d9" stroke-width="2"/><text x="592" y="1122" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">副導線：従来のPDFアップロード</text><text x="592" y="1167" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">詳細の折りたたみ → PDF選択 → POST</text><text x="592" y="1196" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">未提出時のみ。教材DL GET …/:id/material</text><text x="592" y="1225" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">GET …/:id/result は詳細へリダイレクト</text><text x="1120" y="245" dominant-baseline="text-before-edge" font-size="26" fill="#172b46">管理者</text><rect x="1120" y="295" width="500" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="295" width="500" height="44" fill="#eee1f8" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="303" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">ログイン GET/POST /admin/login</text><text x="1132" y="348" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">管理者ID + パスワード</text><path d="M1370,384 L1370,416" stroke="#456583" stroke-width="3" fill="none"/><polygon points="1370,416 1364.7804135906651,405.1946347717679 1375.2195864093349,405.1946347717679" fill="#456583"/><rect x="1120" y="424" width="500" height="86" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="424" width="500" height="44" fill="#eee1f8" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="432" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">管理トップ GET /admin</text><text x="1132" y="477" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">自身の学校内のみ</text><rect x="1120" y="553" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="553" width="500" height="44" fill="#eee1f8" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="561" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">トップ ↔ 教師管理 /admin/teachers</text><text x="1132" y="606" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">一覧 → new / create → 一覧</text><text x="1132" y="635" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">edit / update：担当クラス・PW変更</text><text x="1132" y="664" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">教師登録時にクラス指定・作成</text><rect x="1120" y="740" width="500" height="144" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="740" width="500" height="44" fill="#eee1f8" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="748" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">トップ ↔ 生徒管理 /admin/students</text><text x="1132" y="793" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">一覧・絞込 → new / create</text><text x="1132" y="822" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">edit → POST confirm_update → PATCH</text><text x="1132" y="851" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">confirm_destroy → DELETE：1人を確認</text><rect x="1120" y="927" width="500" height="173" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="927" width="500" height="44" fill="#eee1f8" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="935" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">生徒一覧 → PW再設定</text><text x="1132" y="980" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">GET …/:id/password_reset/edit</text><text x="1132" y="1009" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">PATCH …/:id/password_reset</text><text x="1132" y="1038" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">対象確認・管理者再認証</text><text x="1132" y="1067" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">教師PW変更・生徒削除も再認証条件あり</text><rect x="1120" y="1143" width="500" height="173" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="1120" y="1143" width="500" height="44" fill="#eee1f8" stroke="#b8c7d9" stroke-width="2"/><text x="1132" y="1151" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">登録・認可の補足</text><text x="1132" y="1196" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">教師にも GET /students/new の登録画面</text><text x="1132" y="1225" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">POST /students で担当クラスの生徒を登録</text><text x="1132" y="1254" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">担当クラス限定（公開登録ではない）</text><text x="1132" y="1283" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">教師の配信登録は学校内クラスを選択</text><text x="40" y="1400" dominant-baseline="text-before-edge" font-size="23" fill="#172b46">共通・分岐（上からの矢印は代表導線。副導線と条件操作は必須手順ではない）</text><rect x="40" y="1450" width="770" height="173" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="40" y="1450" width="770" height="44" fill="#dceafe" stroke="#b8c7d9" stroke-width="2"/><text x="52" y="1458" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">教師の成績出力 / 戻る / ログアウト</text><text x="52" y="1503" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">詳細 → GET /assignments/:id/export.xlsx?classroom_id=…</text><text x="52" y="1532" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">クラスまたは all を指定。詳細↔答案、一覧↔詳細の戻り導線あり</text><text x="52" y="1561" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">通常 DELETE logout → 各ログイン。デモはトップへ</text><text x="52" y="1590" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">404 / 500 → GET /。認証制限 429 / 利用不可 503</text><rect x="840" y="1450" width="780" height="173" fill="#ffffff" stroke="#b8c7d9" stroke-width="2"/><rect x="840" y="1450" width="780" height="44" fill="#fff0cc" stroke="#b8c7d9" stroke-width="2"/><text x="852" y="1458" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">ゲスト：実装済み / 通常は OFF</text><text x="852" y="1503" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">有効な隔離デモ構成のみ POST /guest/:role（3ロール）</text><text x="852" y="1532" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">合成データの許可された GET のみ。登録・変更・手書き不可</text><text x="852" y="1561" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">教師Excel・答案閲覧は許可。15分期限、ログアウトで失効</text><text x="852" y="1590" dominant-baseline="text-before-edge" font-size="18" fill="#172b46">実装と公開デプロイは別。現在の公開ゲストURLは未確認</text><text x="40" y="1710" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">手書きの競合・教材変更・認証切れ・保存失敗は状態別に案内。読取を新たに再実行する UI はない。</text><text x="40" y="1750" dominant-baseline="text-before-edge" font-size="21" fill="#172b46">同じ画面の保存・確認・失敗状態を独立した製品画面として数えない。</text></svg>
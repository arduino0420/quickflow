# One normal-application topology for Mac and AWS. Guest migration is deferred.
# Provision new local data explicitly. AWS migration requires separate approval.
services:
  db:
    image: ${QF_POSTGRES_IMAGE:-postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336}
    environment:
      POSTGRES_USER: quickflow
      POSTGRES_PASSWORD: ${QF_DB_PASSWORD:?Set an independent database password}
      POSTGRES_DB: quickflow_production
    volumes:
      - db_data:/var/lib/postgresql
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quickflow -d quickflow_production"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  web:
    image: ${QF_IMAGE:?Set the immutable release image reference}
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${QF_SOURCE_REVISION:?Set the source revision}
    init: true
    # Do not inherit the Dockerfile entrypoint's automatic db:prepare.
    entrypoint: []
    command: [./bin/thrust, ./bin/rails, server]
    env_file: ['${QF_APP_ENV_FILE:?Set the app-only private environment file}']
    environment:
      RAILS_ENV: production
      PGHOST: db
      QUICKFLOW_DATABASE_PASSWORD: ${QF_DB_PASSWORD:?Set the database password}
      SECRET_KEY_BASE: ${QF_SECRET_KEY_BASE:?Set an independent session secret}
      SOLID_QUEUE_IN_PUMA: 'true'
      QUICKFLOW_GRADING_RECOVERY_ENABLED: 'true'
    volumes:
      - storage:/rails/storage
    networks: [app]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  caddy:
    image: ${QF_CADDY_IMAGE:-caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af}
    environment:
      QF_SITE_ADDRESS: ${QF_SITE_ADDRESS:-https://localhost}
    volumes:
      - type: bind
        source: ./docker/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${QF_BIND_ADDRESS:-127.0.0.1}:${QF_HTTP_PORT:-18080}:80'
      - '${QF_BIND_ADDRESS:-127.0.0.1}:${QF_HTTPS_PORT:-18444}:443'
    networks: [app]
    depends_on: [web]
    restart: unless-stopped
networks:
  app: {}
volumes:
  db_data:
    external: true
    name: ${QF_DB_VOLUME:?Select the existing or explicitly created DB volume}
  storage:
    external: true
    name: ${QF_STORAGE_VOLUME:?Select the existing or explicitly created PDF volume}
  caddy_data:
    external: true
    name: ${QF_CADDY_DATA_VOLUME:?Select the certificate volume}
  caddy_config:
    external: true
    name: ${QF_CADDY_CONFIG_VOLUME:?Select the Caddy configuration volume}

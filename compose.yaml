# One normal-application topology for Mac and AWS; guest services stay separate.
# Production is the default. bin/dev-docker supplies local environment values only.
services:
  db:
    image: ${QF_POSTGRES_IMAGE:-postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336}
    environment:
      POSTGRES_USER: quickflow
      POSTGRES_PASSWORD: ${QF_DB_PASSWORD:?Set an independent database password}
      POSTGRES_DB: ${QF_DATABASE_NAME:-quickflow_production}
    volumes:
      - db_data:/var/lib/postgresql
    networks: [default]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quickflow -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  web:
    image: ${QF_IMAGE:?Set the immutable release image reference}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${QF_BUILD_TARGET:-production}
      labels:
        org.opencontainers.image.revision: ${QF_SOURCE_REVISION:?Set the source revision}
    init: true
    # No automatic db:prepare. The image rejects mismatched runtime settings.
    entrypoint: [/usr/local/bin/quickflow-compose-entrypoint]
    command: [server]
    read_only: ${QF_READ_ONLY:-true}
    env_file: ['${QF_APP_ENV_FILE:?Set the app-only private environment file}']
    environment:
      RAILS_ENV: ${QF_RAILS_ENV:-production}
      QUICKFLOW_DOCKER_DEVELOPMENT: ${QF_DOCKER_DEVELOPMENT:-0}
      PGUSER: quickflow
      PGPASSWORD: ${QF_DB_PASSWORD:?Set the database password}
      PGHOST: db
      HOME: /rails/tmp
      QUICKFLOW_DATABASE_PASSWORD: ${QF_DB_PASSWORD:?Set the database password}
      SECRET_KEY_BASE: ${QF_SECRET_KEY_BASE:?Set an independent session secret}
      SOLID_QUEUE_IN_PUMA: 'true'
      QUICKFLOW_GRADING_RECOVERY_ENABLED: 'true'
    volumes:
      - storage:/rails/storage
      - runtime_tmp:/rails/tmp
      - runtime_log:/rails/log
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,exec
    # Sync is opt-in (up --watch / watch). Production rootfs is read-only.
    # Only portable application code is shared; never host gems, qpdf or assets.
    develop:
      watch:
        - action: sync
          path: ./app
          target: /rails/app
          initial_sync: true
          ignore: [assets/builds/]
        - action: sync
          path: ./lib
          target: /rails/lib
          initial_sync: true
        - action: sync
          path: ./public
          target: /rails/public
          initial_sync: true
          ignore: [assets/]
        - action: sync+restart
          path: ./config
          target: /rails/config
          initial_sync: true
          ignore: ['*.key', credentials/]
    networks: [default]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://localhost/up]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
  caddy:
    image: ${QF_CADDY_IMAGE:-caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af}
    environment:
      QF_SITE_ADDRESS: ${QF_SITE_ADDRESS:-https://localhost}
      QF_CADDY_EXTRA_CONFIG: ${QF_CADDY_EXTRA_CONFIG:-/dev/null}
      QF_SHARED_NORMAL_HOST: ${QF_SHARED_NORMAL_HOST:-}
      QF_GUEST_HOST: ${QF_GUEST_HOST:-}
      QF_GUEST_UPSTREAM: ${QF_GUEST_UPSTREAM:-}
      QF_GUEST_CA_FILE: ${QF_GUEST_CA_FILE:-}
    volumes:
      - type: bind
        source: ./docker/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/aws-shared.caddy
        target: /etc/caddy/aws-shared.caddy
        read_only: true
        bind: {create_host_path: false}
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${QF_HTTP_BIND:-127.0.0.1:18080}:80'
      - '${QF_HTTPS_BIND:-127.0.0.1:18443}:443'
    networks: [default, guest_route]
    restart: unless-stopped
networks:
  default:
    external: ${QF_EXTERNAL_RESOURCES:-true}
    name: ${QF_APP_NETWORK:?Select the existing or explicitly created app network}
  guest_route:
    external: ${QF_EXTERNAL_RESOURCES:-true}
    name: ${QF_GUEST_NETWORK:?Select the existing guest network or an empty local internal network}
volumes:
  db_data:
    external: ${QF_EXTERNAL_RESOURCES:-true}
    name: ${QF_DB_VOLUME:?Select the existing or explicitly created DB volume}
  storage:
    external: ${QF_EXTERNAL_RESOURCES:-true}
    name: ${QF_STORAGE_VOLUME:?Select the existing or explicitly created PDF volume}
  caddy_data:
    external: ${QF_EXTERNAL_RESOURCES:-true}
    name: ${QF_CADDY_DATA_VOLUME:?Select the certificate volume}
  caddy_config:
    external: ${QF_EXTERNAL_RESOURCES:-true}
    name: ${QF_CADDY_CONFIG_VOLUME:?Select the Caddy configuration volume}
  # Writable runtime files are separate from application code in both environments.
  runtime_tmp:
  runtime_log:
